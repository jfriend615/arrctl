name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (e.g. v0.3.0). Required for manual runs.'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -e
          mkdir -p dist
          BIN="arrctl"
          OUT_DIR="dist/arrctl_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "$OUT_DIR"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/jfriend615/arrctl/internal/commands.version=v${VERSION}" -o "$OUT_DIR/$BIN" ./cmd/arrctl
          tar -C dist -czf "dist/arrctl_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "arrctl_${VERSION}_${GOOS}_${GOARCH}"
          rm -rf "$OUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arrctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -name '*.tar.gz' -exec cp {} release/ \;

      - name: Compute version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd release
          shasum -a 256 *.tar.gz > SHA256SUMS

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
